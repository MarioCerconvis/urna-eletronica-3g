name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      URNA3G_SEM_SOM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliotecas de sistema para Qt offscreen e OpenCV
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,camera,servidor,blockchain,dev]"
      - name: Lint (ruff)
        run: ruff check src tests deploy/blockchain experimentos
      - name: Testes
        run: pytest -q --cov=urna3g --cov-report=term-missing
      - name: Demo ponta a ponta
        run: urna3g demo --saida /tmp/demo --eleitores 30 --pdfs 2 --semente 1
