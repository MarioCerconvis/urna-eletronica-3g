[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urna3g"
version = "2.0.0a1"
description = "Urna eletrônica de 3ª geração (UFABC/LAOB): cédula impressa com QR assinado, verificação e apuração auditáveis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "LAOB - UFABC" },
]
keywords = ["urna eletrônica", "voto impresso", "VVPAT", "eleição", "auditoria"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42",
  "qrcode[pil]>=7.4",
  "pillow>=10",
  "reportlab>=4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
camera = ["opencv-python-headless>=4.9"]
servidor = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2"]
blockchain = ["web3>=6", "py-solc-x>=2"]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "ruff", "mypy", "types-requests"]

[project.scripts]
urna3g = "urna3g.cli:main"

[project.urls]
Homepage = "https://github.com/MarioCerconvis/urna-eletronica-3g"
"Projeto original (2016/2017)" = "http://professor.ufabc.edu.br/~mario.gazziro/project2.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urna3g = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
