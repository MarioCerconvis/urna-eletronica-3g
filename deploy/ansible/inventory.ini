# Inventário de exemplo para o laboratório: ajuste IPs/hostnames.
# Cada host recebe papel e seção; o playbook copia SOMENTE as chaves do papel.

[urnas_001]
urna01 ansible_host=10.10.0.101
urna02 ansible_host=10.10.0.102
urna03 ansible_host=10.10.0.103
urna04 ansible_host=10.10.0.104

[urnas_002]
urna05 ansible_host=10.10.0.105
urna06 ansible_host=10.10.0.106
urna07 ansible_host=10.10.0.107
urna08 ansible_host=10.10.0.108

[verificadores]
verif01 ansible_host=10.10.0.111 secao=001
verif02 ansible_host=10.10.0.112 secao=002

[apuradores]
apur01 ansible_host=10.10.0.121 secao=001 impressora=QL-700
apur02 ansible_host=10.10.0.122 secao=002 impressora=QL-700

[reserva]
