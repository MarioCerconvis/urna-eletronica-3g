[urnas_001:vars]
papel=votar
secao=001
impressora=QL-700

[urnas_002:vars]
papel=votar
secao=002
impressora=QL-700

[verificadores:vars]
papel=verificar

[apuradores:vars]
papel=apurar

[reserva:vars]
papel=votar

[all:vars]
ansible_user=admin
ansible_become=true
# diretório, na máquina de controle (comissão), com eleicao/ (manifesto assinado + fotos) e chaves/
pacote_local=../../minha-eleicao
