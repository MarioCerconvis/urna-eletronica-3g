# docker compose -f deploy/servidor/docker-compose.yml up -d
# ./dados deve conter: eleicao.json, eleicao.sig, fotos/, chaves/autoridade.pub, chaves/apuracao-<ID>.pub, chaves/secao-<ID>.pub
services:
  mural:
    build:
      context: ../..
      dockerfile: deploy/servidor/Dockerfile
    image: urna3g-mural:local
    restart: unless-stopped
    volumes:
      - ./dados:/dados        # mural.db é criado aqui (precisa de escrita)
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
